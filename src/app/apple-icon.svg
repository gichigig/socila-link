<svg width="180" height="180" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#141926" />
      <stop offset="100%" stopColor="#07090E" />
    </linearGradient>
    <linearGradient id="socilalinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF3366" />
      <stop offset="50%" stopColor="#F43F5E" />
      <stop offset="100%" stopColor="#9333EA" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luxury Dark Squircle Background for iOS Home Screen -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" fill="none" />

  <!-- Ambient Glow Behind Heart -->
  <circle cx="32" cy="30" r="16" fill="#F43F5E" opacity="0.32" filter="url(#glow)" />

  <!-- Continuous Interconnected Heart Ribbon -->
  <path
    d="M32 52C32 52 11 37.5 11 23C11 15 17 9 25 9C29.5 9 32 11.5 32 11.5C32 11.5 34.5 9 39 9C47 9 53 15 53 23C53 37.5 32 52 32 52Z"
    stroke="url(#socilalinkGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Central Connection Link Loop -->
  <path
    d="M24.5 29.5C24.5 25.5 28 22.5 32 26C36 29.5 39.5 25.5 39.5 25.5"
    stroke="url(#socilalinkGrad)"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Sparkle of Chemistry in Upper Right -->
  <path
    d="M48 13L49.5 9.5L53 8L49.5 6.5L48 3L46.5 6.5L43 8L46.5 9.5L48 13Z"
    fill="url(#sparkleGrad)"
  />
</svg>
